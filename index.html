<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Family Hub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
</head>

<body data-theme="light">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <span>🏠</span>
      <h2>Family Hub</h2>
    </div>

    <nav>

      <button class="nav-btn active" data-page="dashboard">
        🏠 Dashboard
      </button>

      <button class="nav-btn" data-page="feed">
        📰 Feed
      </button>

      <button class="nav-btn" data-page="messages">
        💬 Messages
      </button>

      <button class="nav-btn" data-page="events">
        📅 Events
      </button>

      <button class="nav-btn" data-page="directory">
        📍 Directory
      </button>

      <button class="nav-btn" data-page="surveys">
        📊 Surveys
      </button>

    </nav>

  </aside>

  <div id="appShell">
    <!-- MAIN -->
    <main class="main-content">

      <!-- TOPBAR -->
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
        </div>

        <div class="topbar-actions">

          <button id="themeToggle">
            🌙
          </button>

          <button id="loginBtn" class="primary-btn">
            Sign In
          </button>

        </div>

        <div class="notification-wrapper">

    <button
      id="notificationBtn"
      class="notification-btn"
      title="Notifications"
      aria-label="Notifications"
    >

      🔔

      <span
        id="notificationBadge"
        class="notification-badge hidden"
      >
        0
      </span>

    </button>


    <div
      id="notificationPanel"
      class="notification-panel hidden"
    >

      <div class="notification-panel-header">

        <div>

          <h3>
            Notifications
          </h3>

          <span>
            Stay up to date with Family Hub
          </span>

        </div>

        <button
          id="markAllNotificationsBtn"
          class="mark-all-btn"
        >
          Mark all read
        </button>

      </div>


      <div
        id="notificationList"
        class="notification-list"
      ></div>

    </div>

  </div>
      </header>

      <!-- PAGE CONTENT -->
      <section id="contentArea"></section>

    </main>
  </div>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal hidden">

    <div class="modal-box">

      <h2 id="authTitle">Welcome back</h2>

      <p class="modal-text" id="authSubtitle">
        Sign in to continue to Family Hub
      </p>

      <div id="loginFormView">
        <input id="username" placeholder="Username or email">

        <input
          id="password"
          type="password"
          placeholder="Password"
        >

        <button id="submitLogin" class="primary-btn">
          Sign In
        </button>

        <p class="modal-text" style="margin-top: 16px; text-align: center;">
          Need an account?
          <button type="button" id="showSignupBtn" class="primary-btn" style="padding: 8px 12px; margin-left: 8px;">
            Create one
          </button>
        </p>
      </div>

      <div id="signupFormView" class="hidden">
        <input id="registerFullName" placeholder="Full name">
        <input id="registerEmail" type="email" placeholder="Email address">
        <input id="registerUsername" placeholder="Username">
        <input id="registerPassword" type="password" placeholder="Password (min 6)">

        <button id="submitRegister" class="primary-btn">
          Create Account
        </button>

        <p class="modal-text" style="margin-top: 16px; text-align: center;">
          Already have an account?
          <button type="button" id="showLoginBtn" class="primary-btn" style="padding: 8px 12px; margin-left: 8px;">
            Sign in
          </button>
        </p>
      </div>

    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>

  <script src="js/modules/notifications.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/feed.js"></script>
  <script src="js/modules/messages.js"></script>
  <script src="js/modules/events.js"></script>
  <script src="js/modules/directory.js"></script>
  <script src="js/modules/surveys.js"></script>

  <script src="js/app.js"></script>

</body>
</html>
